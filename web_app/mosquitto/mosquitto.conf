persistence true
persistence_location /mosquitto/data/

listener 1883
# DESENVOLVIMENTO APENAS. Em produção/demo final:
#   allow_anonymous false
#   password_file /mosquitto/config/passwd   (mosquitto_passwd -c passwd utilizador)
#   acl_file /mosquitto/config/acl           (cada ESP32 só publica em atm/<o-seu-id>/#)
# e ativa TLS na porta 8883.
allow_anonymous true
